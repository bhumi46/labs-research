version: "3.9"

# Run the full local stack: make docker-compose-up
# MLflow UI  → http://localhost:5000
# API docs   → http://localhost:8000/docs

services:

  # ── MLflow Tracking Server ───────────────────────────────────────────────
  # Stores experiment runs, metrics, and model artifacts locally
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns          # Experiment run data
      - ./mlartifacts:/mlartifacts  # Model artifacts
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri /mlruns
        --default-artifact-root /mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Model Serving API ────────────────────────────────────────────────────
  # FastAPI app that loads the Production model from MLflow Registry
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=house-price-model
      - MLFLOW_MODEL_STAGE=Production
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mlruns:
  mlartifacts:
