name: CI

# Triggers: every push to any branch, and every PR targeting main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Lint & Format ─────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (black, isort, flake8)
        run: pre-commit run --all-files

  # ── Job 2: Unit Tests ────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint   # Only run tests if lint passes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov=serve --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 3: Run ML Pipeline ────────────────────────────────────────────────
  # MLOps Concept: Training is part of CI — every PR runs the pipeline
  # This catches regressions in data processing or model quality
  train:
    name: Run ML Pipeline
    runs-on: ubuntu-latest
    needs: test   # Only run pipeline if tests pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Initialize DVC
        run: dvc init --no-scm

      - name: Run full DVC pipeline (ingest → preprocess → features → train → evaluate)
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-metrics
          path: metrics/

      # Post metrics as a PR comment (so reviewers can see model quality)
      - name: Comment metrics on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testMetrics = JSON.parse(fs.readFileSync('metrics/test_metrics.json', 'utf8'));
            const trainMetrics = JSON.parse(fs.readFileSync('metrics/train_metrics.json', 'utf8'));

            const body = `## 🤖 ML Pipeline Results

            | Metric | Train | Test |
            |--------|-------|------|
            | RMSE   | ${trainMetrics.rmse.toFixed(4)} | ${testMetrics.rmse.toFixed(4)} |
            | MAE    | ${trainMetrics.mae.toFixed(4)} | ${testMetrics.mae.toFixed(4)} |
            | R²     | ${trainMetrics.r2.toFixed(4)} | ${testMetrics.r2.toFixed(4)} |

            *Lower RMSE/MAE and higher R² = better model*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
