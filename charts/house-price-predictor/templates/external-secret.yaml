{{- if .Values.externalSecret.enabled }}
# ExternalSecret — tells ESO what to fetch from Vault and what K8s Secret to create.
# ESO pulls from Vault → creates K8s Secret → Reloader detects change → rolling restart.
# Zero secret values stored in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}

  target:
    name: {{ .Release.Name }}-secrets   # K8s Secret ESO will create/manage
    creationPolicy: Owner               # ESO owns this secret — deleted with ExternalSecret

  data:
    {{- range .Values.externalSecret.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecret.vaultBasePath }}
        property: {{ .vaultProperty }}
    {{- end }}
{{- end }}
