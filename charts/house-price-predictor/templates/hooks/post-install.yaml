# Post-install hook — runs AFTER all chart resources are created.
# Use case: smoke test that the API is actually responding correctly.
# If this Job fails, Helm marks the release as failed → PipeCD auto-rolls back.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-install
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade   # runs after both install and upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              # Wait for the service to be ready, then hit the health endpoint
              echo "Waiting for service to be ready..."
              sleep 10
              curl --fail --retry 5 --retry-delay 5 \
                http://{{ .Release.Name }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}/health \
                && echo "Smoke test passed" \
                || (echo "Smoke test FAILED — rolling back" && exit 1)
